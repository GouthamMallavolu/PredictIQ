name: Deploy to Azure

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Azure Login
      if: ${{ secrets.AZURE_CREDENTIALS != '' }}
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Build Docker image
      run: |
        docker build -t finsightai:${{ github.sha }} .
        echo "Docker image built successfully"
    
    - name: Login to Azure Container Registry
      if: ${{ secrets.AZURE_CREDENTIALS != '' }}
      run: |
        az acr login --name finsightairegistry
    
    - name: Tag and push Docker image
      if: ${{ secrets.AZURE_CREDENTIALS != '' }}
      run: |
        docker tag finsightai:${{ github.sha }} finsightairegistry.azurecr.io/finsightai-api:${{ github.sha }}
        docker tag finsightai:${{ github.sha }} finsightairegistry.azurecr.io/finsightai-api:latest
        docker push finsightairegistry.azurecr.io/finsightai-api:${{ github.sha }}
        docker push finsightairegistry.azurecr.io/finsightai-api:latest
    
    - name: Deploy to Azure Container Apps
      if: ${{ secrets.AZURE_CREDENTIALS != '' }}
      run: |
        az containerapp update \
          --name finsightai-api \
          --resource-group FinSightAI-RG \
          --image finsightairegistry.azurecr.io/finsightai-api:${{ github.sha }}
    
    - name: Skip deployment (no Azure credentials)
      if: ${{ secrets.AZURE_CREDENTIALS == '' }}
      run: |
        echo "Skipping Azure deployment - AZURE_CREDENTIALS secret not configured"
        echo "To enable deployment, add AZURE_CREDENTIALS secret in GitHub repository settings"

