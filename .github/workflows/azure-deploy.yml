name: Deploy to Azure

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t finsightai:${{ github.sha }} .
        echo "Docker image built successfully"
    
    - name: Azure Login
      continue-on-error: true
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Login to Azure Container Registry
      continue-on-error: true
      run: |
        az acr login --name finsightairegistry
    
    - name: Tag and push Docker image
      continue-on-error: true
      run: |
        docker tag finsightai:${{ github.sha }} finsightairegistry.azurecr.io/finsightai-api:${{ github.sha }}
        docker tag finsightai:${{ github.sha }} finsightairegistry.azurecr.io/finsightai-api:latest
        docker push finsightairegistry.azurecr.io/finsightai-api:${{ github.sha }}
        docker push finsightairegistry.azurecr.io/finsightai-api:latest
    
    - name: Deploy to Azure Container Apps
      continue-on-error: true
      run: |
        az containerapp update \
          --name finsightai-api \
          --resource-group FinSightAI-RG \
          --image finsightairegistry.azurecr.io/finsightai-api:${{ github.sha }}
    
    - name: Deployment Status
      if: always()
      run: |
        echo "Workflow completed"
        echo "Note: If Azure deployment failed, ensure AZURE_CREDENTIALS secret is configured"
        echo "See: https://github.com/${{ github.repository }}/settings/secrets/actions"

